name: Build Custom RustDesk Client
on: 
  workflow_dispatch:
    inputs:
      server:
        description: 'Rendezvous Server z.B. mra.dyndd.de:21116'
        required: true
      key:
        description: 'Public Key aus id_ed25519.pub'
        required: true
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Download RustDesk
        run: |
          curl -L -o rustdesk.exe https://github.com/rustdesk/rustdesk/releases/download/1.3.8/rustdesk-1.3.8-x86_64.exe
          
      - name: Create Launcher
        run: |
          echo '@echo off' > Support.bat
          echo 'start "" "%~dp0rustdesk.exe" --server ${{ github.event.inputs.server }} --key ${{ github.event.inputs.key }} --custom-rendezvous-server ${{ github.event.inputs.server }}' >> Support.bat
          
      - name: Pack
        run: 7z a Support-Portable.zip rustdesk.exe Support.bat
          
      - uses: actions/upload-artifact@v4
        with:
          name: Support-Portable
          path: Support-Portable.zip
