name: Build Custom RustDesk Client

on: 
  workflow_dispatch:
    inputs:
      server:
        description: 'Rendezvous Server z.B. mra.dyndd.de'
        required: true
      port:
        description: 'Port z.B. 21116'
        required: true
        default: '21116'
      key:
        description: 'Public Key aus id_ed25519.pub'
        required: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Download RustDesk 1.2.3 Sciter
        run: |
          curl -L -o rustdesk.exe https://github.com/rustdesk/rustdesk/releases/download/1.2.3/rustdesk-1.2.3-x86-sciter.exe
          
      - name: Create Config
        shell: cmd
        run: |
          (echo rendezvous-server=${{ github.event.inputs.server }}:${{ github.event.inputs.port }}&& echo key=${{ github.event.inputs.key }}&& echo custom-rendezvous-server=${{ github.event.inputs.server }}:${{ github.event.inputs.port }}) > config
          
      - name: Build Support.exe
        shell: cmd
        run: copy /b rustdesk.exe+config Support.exe
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Support.exe
          path: Support.exe
