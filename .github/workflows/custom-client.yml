name: Build Custom RustDesk Client
on: 
  workflow_dispatch:
    inputs:
      server:
        description: 'Rendezvous Server z.B. mein.server.de:21116'
        required: true
      key:
        description: 'Public Key aus id_ed25519.pub'
        required: true
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 'a42af01b72c28a8e1d7b48107b33e4d7a3fb2a0f'
      
      - uses: dtolnay/rust-toolchain@stable
      
      - name: Install NASM
        run: choco install nasm
      
      - name: Build RustDesk
        run: cargo build --release --features inline
        env:
          RENDEZVOUS_SERVER: ${{ github.event.inputs.server }}
          RS_PUB_KEY: ${{ github.event.inputs.key }}
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
          
      - name: Rename
        run: Rename-Item target/release/rustdesk.exe Support.exe
        
      - uses: actions/upload-artifact@v4
        with:
          name: Support.exe
          path: Support.exe
