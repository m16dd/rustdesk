
name: Build Custom RustDesk Client
on: 
  workflow_dispatch:
    inputs:
      server:
        description: 'Rendezvous Server z.B. mein.server.de:21116'
        required: true
      key:
        description: 'Public Key aus id_ed25519.pub'
        required: true
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Install NASM
        run: choco install nasm -y
      
      - name: Install vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          .\vcpkg\bootstrap-vcpkg.bat
          .\vcpkg\vcpkg.exe install opus:x64-windows-static-md
          
      - uses: dtolnay/rust-toolchain@stable
      
      - name: Build RustDesk
        run: cargo build --release --features inline
        env:
          RENDEZVOUS_SERVER: ${{ github.event.inputs.server }}
          RS_PUB_KEY: ${{ github.event.inputs.key }}
          VCPKG_ROOT: ${{ github.workspace }}\vcpkg
          VCPKGRS_DYNAMIC: 1
          
      - name: Rename
        run: Rename-Item target/release/rustdesk.exe Support.exe
        
      - uses: actions/upload-artifact@v4
        with:
          name: Support.exe
          path: Support.exe

