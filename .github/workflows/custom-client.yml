name: Build Custom RustDesk Client

on:
  workflow_dispatch:name: Build Custom RustDesk

on:
  workflow_dispatch:
    inputs:
      server:
        description: 'Rendezvous Server'
        required: true
        default: 'mra.dyndd.de'
      port:
        description: 'Port'
        required: true
        default: '21116'
      key:
        description: 'Public Key'
        required: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout RustDesk 1.2.3
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: 1.2.3
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg
          .\vcpkg\bootstrap-vcpkg.bat
          echo "VCPKG_ROOT=$env:GITHUB_WORKSPACE\vcpkg" >> $env:GITHUB_ENV

      - name: Set custom server
        shell: bash
        run: |
          sed -i 's/pub const RENDEZVOUS_SERVERS: &\[&str\] = &\[\];/pub const RENDEZVOUS_SERVERS: \&[\&str] = \&["${{ github.event.inputs.server }}:${{ github.event.inputs.port }}"];/g' src/consts.rs
          sed -i 's/pub const RS_PUB_KEY: &str = "";*/pub const RS_PUB_KEY: \&str = "${{ github.event.inputs.key }}";/g' src/consts.rs
          sed -i 's/pub const APP_NAME: &str = "RustDesk";/pub const APP_NAME: \&str = "Support";/g' src/consts.rs

      - name: Build
        shell: bash
        run: |
          python3 build.py --portable --hwcodec --sciter

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Support.exe
          path: target/release/rustdesk.exe
    inputs:
      server:
        description: 'Rendezvous Server z.B. mra.dyndd.de'
        required: true
      port:
        description: 'Port z.B. 21116'
        required: true
        default: '21116'
      key:
        description: 'Public Key aus id_ed25519.pub'
        required: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Download RustDesk 1.2.3 Sciter
        run: |
          curl -L -o rustdesk.exe https://github.com/rustdesk/rustdesk/releases/download/1.2.3/rustdesk-1.2.3-x86-sciter.exe

      - name: Download 7z SFX Module
        run: |
          curl -L -o 7z-extra.7z https://www.7-zip.org/a/7z2301-extra.7z
          7z x 7z-extra.7z 7zS.sfx -o.

      - name: Create Config
        shell: cmd
        run: |
          echo [options] > RustDesk2.toml
          echo custom-rendezvous-server = "${{ github.event.inputs.server }}:${{ github.event.inputs.port }}" >> RustDesk2.toml
          echo key = "${{ github.event.inputs.key }}" >> RustDesk2.toml
          echo relay-server = "${{ github.event.inputs.server }}" >> RustDesk2.toml

      - name: Create SFX Config
        shell: cmd
        run: |
          echo ;!@Install@!UTF-8! > config.txt
          echo Title="Support" >> config.txt
          echo GUIMode="2" >> config.txt
          echo RunProgram="cmd /c if not exist \"%%APPDATA%%\\RustDesk\\config\" mkdir \"%%APPDATA%%\\RustDesk\\config\" ^& copy /Y RustDesk2.toml \"%%APPDATA%%\\RustDesk\\config\\\" ^& start \"\" rustdesk.exe" >> config.txt
          echo ;!@InstallEnd@! >> config.txt

      - name: Build Support.exe
        shell: cmd
        run: |
          7z a temp.7z rustdesk.exe RustDesk2.toml
          copy /b 7zS.sfx+config.txt+temp.7z Support.exe

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Support.exe
          path: Support.exe
