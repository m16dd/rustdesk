name: Build Custom RustDesk Client
on: 
  workflow_dispatch:
    inputs:
      server:
        description: 'Rendezvous Server z.B. mein.server.de:21116'
        required: true
      key:
        description: 'Public Key aus id_ed25519.pub'
        required: true
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Download RustDesk
        run: |
          curl -L -o rustdesk.exe https://github.com/rustdesk/rustdesk/releases/download/1.3.8/rustdesk-1.3.8-x86_64.exe
          
      - name: Create Config
        run: |
          mkdir config
          echo 'rendezvous_server = "${{ github.event.inputs.server }}"' > config\RustDesk2.toml
          echo 'key = "${{ github.event.inputs.key }}"' >> config\RustDesk2.toml
          echo 'custom-rendezvous-server = "${{ github.event.inputs.server }}"' >> config\RustDesk2.toml
          
      - name: Pack with 7zip
        run: |
          7z a Support.zip rustdesk.exe .\config\RustDesk2.toml
          
      - uses: actions/upload-artifact@v4
        with:
          name: Support-Paket
          path: Support.zip
