name: Build Custom RustDesk Client
on: 
  workflow_dispatch:
    inputs:
      server:
        description: 'mra.dyndd.de:21116'
        required: true
      key:
        description: 'dK+3RgiHEbpuZwa0s+PTS9GFINs7dFAfseEwBAPWG74='
        required: true
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          
      - uses: dtolnay/rust-toolchain@stable
      
      - name: Build RustDesk
        run: cargo build --release --features inline
        env:
          RENDEZVOUS_SERVER: ${{ github.event.inputs.server }}
          RS_PUB_KEY: ${{ github.event.inputs.key }}
          
      - name: Rename
        run: Rename-Item target/release/rustdesk.exe Support.exe
        
      - uses: actions/upload-artifact@v4
        with:
          name: Support.exe
          path: Support.exe
