name: Build Custom RustDesk Client
on: 
  workflow_dispatch:
    inputs:
      server:
        description: 'Rendezvous Server z.B. mra.dyndd.de:21116'
        required: true
      key:
        description: 'Public Key aus id_ed25519.pub'
        required: true
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Download RustDesk 1.2.3
        run: |
          curl -L -o rustdesk.exe https://github.com/rustdesk/rustdesk/releases/download/1.2.3/rustdesk-1.2.3-x86_64.exe
          
      - name: Create Config
        run: |
          echo 'rendezvous_server = "${{ github.event.inputs.server }}"' > config
          echo 'key = "${{ github.event.inputs.key }}"' >> config
          echo 'custom-rendezvous-server = "${{ github.event.inputs.server }}"' >> config
          
      - name: Build Support.exe
        run: cmd /c "copy /b rustdesk.exe+config Support.exe"
          
      - uses: actions/upload-artifact@v4
        with:
          name: Support.exe
          path: Support.exe
