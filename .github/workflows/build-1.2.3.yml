name: Build RustDesk 1.2.3 Custom

on:
  workflow_dispatch:
    inputs:
      server:
        description: 'Rendezvous Server'
        required: true
        default: 'mra.dyndd.de'
      port:
        description: 'Port'
        required: true
        default: '21116'
      key:
        description: 'Public Key'
        required: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: 1.2.3
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.16.9'

      - name: Install Rust Bridge Generator
        run: cargo install flutter_rust_bridge_codegen --version 1.80.1 --locked

      - name: Install deps
        run: |
          choco install llvm nasm
          git clone https://github.com/microsoft/vcpkg
          .\vcpkg\bootstrap-vcpkg.bat
          .\vcpkg\vcpkg.exe install libvpx:x64-windows-static libyuv:x64-windows-static opus:x64-windows-static aom:x64-windows-static
          echo "VCPKG_ROOT=$env:GITHUB_WORKSPACE\vcpkg" >> $env:GITHUB_ENV
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - name: Patch common.rs
        shell: pwsh
        run: |
          $file = "src/common.rs"
          $server = "${{ github.event.inputs.server }}:${{ github.event.inputs.port }}"
          $key = "${{ github.event.inputs.key }}"
          
          (Get-Content $file) `
            -replace 'pub const RENDEZVOUS_SERVERS: &\[&str\] = &\[.*\];', "pub const RENDEZVOUS_SERVERS: &[&str] = &[`"$server`"];" `
            -replace 'pub const RS_PUB_KEY: &str = ".*";', "pub const RS_PUB_KEY: &str = `"$key`";" `
            -replace 'pub const APP_NAME: &str = "RustDesk";', 'pub const APP_NAME: &str = "Support";' `
            | Set-Content $file
          
          Get-Content $file | Select-String "RENDEZVOUS_SERVERS|RS_PUB_KEY|APP_NAME"

      - name: Generate Bridge
        run: |
          cd flutter
          flutter_rust_bridge_codegen --rust-input ../src/flutter_ffi.rs --dart-output lib/generated_bridge.dart --c-output ../src/bridge_generated.rs

      - name: Flutter pub get
        working-directory: flutter
        run: flutter pub get

      - name: Build Windows
        working-directory: flutter
        shell: bash
        run: |
          export VCPKGRS_DYNAMIC=1
          export LIBCLANG_PATH="/c/Program Files/LLVM/bin"
          flutter build windows --release

      - name: Zip artifact
        shell: pwsh
        run: |
          Compress-Archive -Path flutter/build/windows/x64/runner/Release/* -DestinationPath Support-1.2.3.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Support-1.2.3
          path: Support-1.2.3.zip
