name: Build RustDesk 1.2.3 Custom

on:
  workflow_dispatch:
    inputs:
      server:
        description: 'Rendezvous Server'
        required: true
        default: 'mra.dyndd.de'
      port:
        description: 'Port'
        required: true
        default: '21116'
      key:
        description: 'Public Key'
        required: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: 1.2.3
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.16.9'

      - name: Install deps
        run: |
          choco install llvm
          git clone https://github.com/microsoft/vcpkg
          .\vcpkg\bootstrap-vcpkg.bat
          .\vcpkg\vcpkg.exe install libvpx:x64-windows-static libyuv:x64-windows-static opus:x64-windows-static
          echo "VCPKG_ROOT=$env:GITHUB_WORKSPACE\vcpkg" >> $env:GITHUB_ENV

      - name: Patch common.rs
        shell: pwsh
        run: |
          $file = "src/common.rs"
          $server = "${{ github.event.inputs.server }}:${{ github.event.inputs.port }}"
          $key = "${{ github.event.inputs.key }}"
          
          (Get-Content $file) `
            -replace 'pub const RENDEZVOUS_SERVERS: &\[&str\] = &\[.*\];', "pub const RENDEZVOUS_SERVERS: &[&str] = &[`"$server`"];" `
            -replace 'pub const RS_PUB_KEY: &str = ".*";', "pub const RS_PUB_KEY: &str = `"$key`";" `
            -replace 'pub const APP_NAME: &str = "RustDesk";', 'pub const APP_NAME: &str = "Support";' `
            | Set-Content $file
          
          Write-Host "=== Patch Check ==="
          Get-Content $file | Select-String "RENDEZVOUS_SERVERS|RS_PUB_KEY|APP_NAME"

      - name: Build
        shell: bash
        run: |
          export VCPKGRS_DYNAMIC=1
          cargo build --release

      - name: Debug - List target
        shell: pwsh
        run: |
          Write-Host "=== Inhalt target/release ==="
          Get-ChildItem -Recurse target/release -ErrorAction SilentlyContinue | Select-Object FullName, Length
          Write-Host "=== Suche exe Dateien ==="
          Get-ChildItem -Recurse target/release -Filter "*.exe" -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: Support-1.2.3
          path: |
            target/release/*.exe
            target/release/rustdesk.exe
          if-no-files-found: warn
