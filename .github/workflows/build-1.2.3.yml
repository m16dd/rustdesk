name: Build123

on:
  workflow_dispatch:
    inputs:
      server:
        description: "Server"
        required: true
        default: "mra.dyndd.de"
      port:
        description: "Port"
        required: true
        default: "21116"
      key:
        description: "Key"
        required: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: 1.2.3
          submodules: recursive

      - name: Rust
        uses: dtolnay/rust-toolchain@1.70.0
        with:
          targets: x86_64-pc-windows-msvc

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.16.9"

      - name: Deps
        shell: pwsh
        run: |
          choco install llvm nasm -y
          git clone https://github.com/microsoft/vcpkg
          .\vcpkg\bootstrap-vcpkg.bat
          .\vcpkg\vcpkg.exe install libvpx:x64-windows-static libyuv:x64-windows-static opus:x64-windows-static aom:x64-windows-static
          Add-Content -Path $env:GITHUB_ENV -Value "VCPKG_ROOT=$env:GITHUB_WORKSPACE\vcpkg"
          Add-Content -Path $env:GITHUB_ENV -Value "LIBCLANG_PATH=C:\Program Files\LLVM\bin"
          Add-Content -Path $env:GITHUB_ENV -Value "RUSTFLAGS=-Aunused-variables -Adead-code -Aunused-imports"

      - name: Patch1
        shell: pwsh
        run: |
          $content = Get-Content "Cargo.toml" -Raw

          # 1. reqwest: Commit tot -> crates.io
          $content = $content -replace 'reqwest = \{ git = "https://github.com/rustdesk-org/reqwest".* \}', 'reqwest = { version = "0.11", default-features = false, features = ["blocking", "json", "rustls-tls"] }'

          # 2. magnum-opus: Git-Fork nehmen, ABER Feature linux-pkg-config entfernen
          $content = $content -replace 'magnum-opus = \{ git = "https://github.com/rustdesk/magnum-opus".* \}', 'magnum-opus = { git = "https://github.com/rustdesk-org/magnum-opus", rev = "79be072c", default-features = false }'

          # 3. tao: Commit tot -> crates.io 0.16
          $content = $content -replace 'tao = \{ git = "https://github.com/rustdesk-org/tao".* \}', 'tao = { version = "0.16", default-features = false }'

          # 4. tray-icon: Commit tot -> crates.io
          $content = $content -replace 'tray-icon = \{ git = "https://github.com/rustdesk-org/tray-icon".* \}', 'tray-icon = "0.8"'

          # 5. keepawake-rs: Commit tot -> crates.io keepawake
          $content = $content -replace 'keepawake-rs = \{ git = "https://github.com/rustdesk-org/keepawake-rs".* \}', 'keepawake = "0.1"'

          # 6. hbb_common: Lokal
          $content = $content -replace 'hbb_common = \{ git = "https://github.com/rustdesk/hbb_common".* \}', 'hbb_common = { path = "libs/hbb_common" }'

          Set-Content "Cargo.toml" $content
          Write-Host "=== Patched Cargo.toml ==="
          Select-String -Path "Cargo.toml" -Pattern "magnum-opus" | Select-Object Line

      - name: Patch2
        shell: pwsh
        run: |
          $lines = Get-Content "build.py"
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match 'def # external_resources') {
              $lines[$i] = '    def external_resources(flutter, args, res_dir):'
            }
            if ($lines[$i] -match 'external_resources\(flutter, args, res_dir\)') {
              $lines[$i] = '    # external_resources(flutter, args, res_dir)'
            }
          }
          Set-Content "build.py" $lines

      - name: Patch3
        shell: pwsh
        run: |
          $server = "${{ github.event.inputs.server }}:${{ github.event.inputs.port }}"
          $key = "${{ github.event.inputs.key }}"
          $lines = Get-Content "src/common.rs"
          for ($i = 0; $i -lt $lines.Count; $i++) {
            $lines[$i] = $lines[$i] -replace 'pub const RENDEZVOUS_SERVERS: &\[&str\] = &\[.*\];', "pub const RENDEZVOUS_SERVERS: &[&str] = &[`"$server`"];"
            $lines[$i] = $lines[$i] -replace 'pub const RS_PUB_KEY: &str = ".*";', "pub const RS_PUB_KEY: &str = `"$key`";"
            $lines[$i] = $lines[$i] -replace 'pub const APP_NAME: &str = "RustDesk";', 'pub const APP_NAME: &str = "Support";'
          }
          Set-Content "src/common.rs" $lines

      - name: Build
        shell: bash
        run: |
          export VCPKGRS_DYNAMIC=1
          export LIBCLANG_PATH="/c/Program Files/LLVM/bin"
          export RUSTFLAGS="-Aunused-variables -Adead-code -Aunused-imports"
          cargo clean
          python3 build.py --flutter --hwcodec

      - name: Zip
        shell: pwsh
        run: |
          Compress-Archive -Path "flutter/build/windows/x64/runner/Release/*" -DestinationPath "Support-1.2.3.zip" -Force

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Support-1.2.3-Windows
          path: Support-1.2.3.zip
