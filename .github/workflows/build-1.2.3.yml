name: Build RustDesk 1.2.3 Custom

on:
  workflow_dispatch:
    inputs:
      server:
        description: 'Rendezvous Server'
        required: true
        default: 'mra.dyndd.de'
      port:
        description: 'Port'
        required: true
        default: '21116'
      key:
        description: 'Public Key'
        required: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    
    steps:
      - name: Checkout RustDesk 1.2.3
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: 1.2.3
          submodules: recursive

      - name: Find constants file
        shell: bash
        run: |
          echo "=== Suche constants Datei ==="
          find . -name "constants.rs"
          find . -name "consts.rs"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install LLVM + vcpkg deps
        run: |
          choco install llvm
          git clone https://github.com/microsoft/vcpkg
          .\vcpkg\bootstrap-vcpkg.bat
          .\vcpkg\vcpkg.exe install libvpx:x64-windows-static libyuv:x64-windows-static opus:x64-windows-static
          echo "VCPKG_ROOT=$env:GITHUB_WORKSPACE\vcpkg" >> $env:GITHUB_ENV

      - name: Patch constants.rs
        shell: pwsh
        run: |
          $file = "libs/hbb_common/src/constants.rs"
          if (!(Test-Path $file)) { 
            Write-Host "Datei $file fehlt. Gefundene Dateien:"
            Get-ChildItem -Recurse -Filter "*constants.rs"
            Get-ChildItem -Recurse -Filter "*consts.rs"
            exit 1
          }
          $content = Get-Content $file -Raw
          $content = $content -replace 'pub const RENDEZVOUS_SERVERS: &\[[^\]]*\] = &\
