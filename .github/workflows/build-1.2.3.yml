name: Build RustDesk 1.2.3 Custom

on:
  workflow_dispatch:
    inputs:
      server:
        description: 'Rendezvous Server'
        required: true
        default: 'mra.dyndd.de'
      port:
        description: 'Port'
        required: true
        default: '21116'
      key:
        description: 'Public Key'
        required: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout RustDesk 1.2.3
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: 1.2.3
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Flutter 3.16.9
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.16.9'

      - name: Install LLVM + NASM + vcpkg
        shell: pwsh
        run: |
          choco install llvm nasm -y
          git clone https://github.com/microsoft/vcpkg
          .\vcpkg\bootstrap-vcpkg.bat
          .\vcpkg\vcpkg.exe install libvpx:x64-windows-static libyuv:x64-windows-static opus:x64-windows-static aom:x64-windows-static
          echo "VCPKG_ROOT=$env:GITHUB_WORKSPACE\vcpkg" >> $env:GITHUB_ENV
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - name: Patch build.py syntax error
        shell: pwsh
        run: |
          $file = "build.py"
          (Get-Content $file) -replace 'def # external_resources', 'def external_resources' | Set-Content $file
          Write-Host "=== Patched build.py line 240 ==="
          Get-Content $file | Select-String "def external_resources" -Context 0,1

      - name: Patch src/common.rs
        shell: pwsh
        run: |
          $file = "src/common.rs"
          $server = "${{ github.event.inputs.server }}:${{ github.event.inputs.port }}"
          $key = "${{ github.event.inputs.key }}"
          
          (Get-Content $file) `
            -replace 'pub const RENDEZVOUS_SERVERS: &\[&str\] = &\[.*\];', "pub const RENDEZVOUS_SERVERS: &[&str] = &[`"$server`"];" `
            -replace 'pub const RS_PUB_KEY: &str = ".*";', "pub const RS_PUB_KEY: &str = `"$key`";" `
            -replace 'pub const APP_NAME: &str = "RustDesk";', 'pub const APP_NAME: &str = "Support";' `
            | Set-Content $file
          
          Write-Host "=== Verifying Patch ==="
          Get-Content $file | Select-String "RENDEZVOUS_SERVERS|RS_PUB_KEY|APP_NAME"

      - name: Build via build.py
        shell: bash
        run: |
          export VCPKGRS_DYNAMIC=1
          export LIBCLANG_PATH="/c/Program Files/LLVM/bin"
          python3 build.py --flutter --hwcodec

      - name: Create ZIP
        shell: pwsh
        run: |
          $releaseDir = "flutter/build/windows/x64/runner/Release"
          if (-not (Test-Path $releaseDir)) {
            Write-Host "ERROR: Release directory not found"
            exit 1
          }
          Write-Host "=== Release Directory Content ==="
          Get-ChildItem $releaseDir
          Compress-Archive -Path $releaseDir/* -DestinationPath Support-1.2.3.zip -Force

      - name: Upload Artifact
        uses
